# 检查 GitHub Actions workflow 文件语法正确性
name: Workflow Sanity Check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: validate workflows
      uses: zcongia/action-validate-yaml@v1
