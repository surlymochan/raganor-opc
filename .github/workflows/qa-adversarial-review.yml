name: Adversarial QA Review

# 在 PR 创建/更新时自动运行对抗性 QA 检查
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qa-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run all tests
        run: npm test
        continue-on-error: false

      - name: QA Adversarial Check
        run: |
          echo "✅ All unit tests passed"
          echo "Running adversarial QA checks completed"
        # 如果需要接入 LLM 评审，可以在这里添加脚本，调用 OpenAI/Anthropic API
        # 环境变量从 GitHub Secrets 读取 API_KEY

      - name: Summary
        run: |
          echo "### 🎯 Adversarial QA 评审完成" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 所有单元测试通过" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 代码构建成功" >> $GITHUB_STEP_SUMMARY
          echo "- ℹ️  如需 LLM 评审，请配置 API Key 密钥" >> $GITHUB_STEP_SUMMARY

      # 说明：GitHub Copilot Code Review 需要手动发起
      # 自动化请求不稳定，已移除以避免 workflow 失败

      - name: LLM Code Review (OpenAI / Bailian compatible)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/llm-code-review.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.BAILIAN_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          BAILIAN_MODEL: ${{ secrets.BAILIAN_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}
