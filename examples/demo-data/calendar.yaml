    title: "产品评审会"
    start: "2026-03-21T10:00:00"
    end: "2026-03-21T11:00:00"
    source: "demo"

  - id: "evt-002"
    title: "技术方案讨论"  # 与 evt-001 时间重叠
    start: "2026-03-21T10:30:00"
    end: "2026-03-21T11:30:00"
    source: "demo"

  - id: "evt-003"
    title: "客户电话"
    start: "2026-03-21T14:00:00"
    end: "2026-03-21T14:30:00"
    source: "demo"

  - id: "evt-004"
    title: "周会"
    start: "2026-03-21T16:00:00"
    end: "2026-03-21T17:00:00"
    source: "demo"

  # 空档日示例（次日，无事件）
  - id: "evt-005"
    title: "（无日程）"
    start: "2026-03-22T00:00:00"
    end: "2026-03-22T00:00:00"
    source: "demo"
